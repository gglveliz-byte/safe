services:
  - type: web
    name: safe-platform
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_MASTER_KEY
        sync: false
      - key: ADMIN_EMAIL
        value: admin@safe.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        value: dppv8ychs
      - key: CLOUDINARY_API_KEY
        value: "859247141367181"
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_FOLDER
        value: safe/riders
      - key: GMAIL_USER
        value: info@neurochat.com.ec
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GMAIL_FROM_NAME
        value: SAFE Auxilio Vial
      - key: EMERGENCY_COOLDOWN_SECONDS
        value: "180"
      - key: EMERGENCY_DISTANCE_THRESHOLD_METERS
        value: "150"
      - key: PIN_MAX_ATTEMPTS
        value: "5"
      - key: PIN_BLOCK_MINUTES
        value: "15"
      - key: SESSION_TTL_SECONDS
        value: "2592000"
      - key: TERMS_VERSION
        value: "2026-01"
